services:
  postgres:
    image: postgres:16
    container_name: PayLite
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paylite}
      POSTGRES_USER: ${POSTGRES_USER:-paylite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paylite_dev}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - paylite-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      PAYLITE_DATABASE_URL: postgresql+psycopg://paylite:paylite_dev@postgres:5432/paylite
    ports:
      - "127.0.0.1:31000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  paylite-postgres:
