services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paylite}
      POSTGRES_USER: ${POSTGRES_USER:-paylite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paylite_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - paylite-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paylite-postgres:
