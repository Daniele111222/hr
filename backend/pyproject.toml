[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paylite-backend"
description = "PayLite local payroll backend"
requires-python = ">=3.13,<3.14"
dynamic = ["version"]
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "openpyxl>=3.1,<4",
    "sqlalchemy>=2.0.36,<3",
    "sqlparse>=0.5,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "import-linter>=2.3,<3",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "paylite.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.importlinter]
root_packages = ["paylite"]

[[tool.importlinter.contracts]]
name = "Database layer stays independent from HTTP and app composition"
type = "forbidden"
source_modules = ["paylite.db"]
forbidden_modules = ["paylite.api", "paylite.application", "paylite.main"]

[[tool.importlinter.contracts]]
name = "ORM models stay independent from configuration and sessions"
type = "forbidden"
source_modules = ["paylite.db.models"]
forbidden_modules = ["paylite.config", "paylite.db.session"]
