name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paylite
          POSTGRES_PASSWORD: paylite_dev
          POSTGRES_DB: paylite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paylite -d paylite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Compile
        run: python -m compileall -q src alembic tests

      - name: Test
        env:
          PAYLITE_TEST_DATABASE_URL: postgresql+psycopg://paylite:paylite_dev@127.0.0.1:5432/paylite_test
          PAYLITE_ALLOW_TEST_DATABASE_RESET: "1"
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag paylite-backend:${{ github.sha }} backend
